version: "3.9"
services:
  fasten-prod:
    image: ghcr.io/jwilleke/yourphr:main
    hostname: ${HOSTNAME:-fasten}
    # Pass YOURPHR_* app config from .env / .env_custom INTO the container (#397). Compose reads
    # .env only for ${...} substitution in THIS file; without env_file those values never reach the
    # app, and nothing warns. Both files are optional.
    env_file:
      - path: .env
        required: false
      - path: .env_custom
        required: false
    environment:
      - HOST_IP=${IP}
      - HOST_PORT=${PORT}
      # Optional one-click sandbox providers (#291). The backend seeds the /sandbox
      # provider catalog from these on startup; any whose CLIENT_ID is unset is skipped
      # (open sandboxes like SMART Health IT need nothing here). The client_secret is held
      # server-side and never sent to the browser. Set the values you have — e.g. via an
      # `env_file:` of real creds, gitignored — and uncomment. See docs/deployment/README.md.
      # - YOURPHR_SANDBOX_BLUEBUTTON_CLIENT_ID=${YOURPHR_SANDBOX_BLUEBUTTON_CLIENT_ID:-}
      # - YOURPHR_SANDBOX_BLUEBUTTON_CLIENT_SECRET=${YOURPHR_SANDBOX_BLUEBUTTON_CLIENT_SECRET:-}
      # - YOURPHR_SANDBOX_EPIC_CLIENT_ID=${YOURPHR_SANDBOX_EPIC_CLIENT_ID:-}            # public/PKCE — no secret
      # - YOURPHR_SANDBOX_ORACLE_CLIENT_ID=${YOURPHR_SANDBOX_ORACLE_CLIENT_ID:-}        # public/PKCE — no secret
      # - YOURPHR_SANDBOX_ATHENA_CLIENT_ID=${YOURPHR_SANDBOX_ATHENA_CLIENT_ID:-}
      # - YOURPHR_SANDBOX_ATHENA_CLIENT_SECRET=${YOURPHR_SANDBOX_ATHENA_CLIENT_SECRET:-}
    ports:
      - "${PORT:-9090}:8080"
    volumes:
      - ./db:/opt/fasten/db
      - ./cache:/opt/fasten/cache
      - ./certs:/opt/fasten/certs/shared

  # C-CDA/CCD converter sidecar (#254, #404). This file previously defined NO cda-converter service,
  # so C-CDA import was impossible on the production compose path — the documented
  # YOURPHR_CDA_CONVERTER_URL had nothing to point at, no matter how it was spelled (#397).
  #
  # C-CDA XML is what patient portals actually export, so this runs by default; the shipped default points
  # the app here out of the box.
  #
  # INTERNAL ONLY — `expose`, never `ports`. Raw C-CDA is PHI; it must not be reachable from outside
  # the compose network. Stateless: holds nothing beyond the in-flight request.
  #
  # Don't want it? `docker compose -f docker-compose-prod.yml up --scale cda-converter=0`, or set
  # YOURPHR_CDA_CONVERTER_ENABLED=false.
  cda-converter:
    image: ghcr.io/jwilleke/yourphr-cda-converter:main
    restart: unless-stopped
    expose:
      - "8080"

  # Typesense powers the optional AI-assisted "Search" and "Chat" features (search.enabled,
  # OFF by default — see backend/pkg/config/app-default-config.json). Present in compose so
  # enabling the feature is just flipping the app config; unused, it costs an idle container.
  # Full setup: docs/deployment/search-and-chat.md
  #
  # Don't want it? `docker compose -f docker-compose-prod.yml up --scale typesense=0`, or leave
  # YOURPHR_SEARCH_ENABLED unset.
  #
  # PUBLISHED, not just `expose`'d — matching upstream fasten-onprem#594. The frontend's
  # TypesenseService talks to Typesense DIRECTLY from the browser (typesense.service.ts), not
  # through fasten-prod, so the port must be reachable from wherever the browser runs, not just
  # from inside the compose network. `fasten-prod` also reaches it at http://typesense:8108.
  # TYPESENSE_API_KEY must match YOURPHR_SEARCH_API_KEY on fasten-prod.
  #
  # Security tradeoff, inherited from upstream and not yet resolved: this reopens exactly what the
  # earlier `expose`-only setup was closing — FHIR-derived records become queryable by anyone who
  # can reach this port. And `search.api_key` is returned in plaintext by the unauthenticated
  # GET /api/settings, so the key alone is not a meaningful barrier. Before enabling search/chat on
  # a real, network-reachable deployment, route this through an authenticated backend proxy
  # instead of relying on this port being firewalled.
  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
    environment:
      - TYPESENSE_API_KEY=${YOURPHR_SEARCH_API_KEY:-xyz123}
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_ENABLE_CORS=true

volumes:
  typesense-data:
