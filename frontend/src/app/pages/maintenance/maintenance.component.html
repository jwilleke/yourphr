<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 60vh;">
  <i class="fas fa-tools fa-3x tx-gray-500 mb-3" aria-hidden="true"></i>
  <h3 class="mb-2">Down for maintenance</h3>
  <p class="tx-14 tx-gray-600 mb-4" style="max-width: 32rem;">
    {{ message || 'yourPHR is down for maintenance. Please try again shortly.' }}
  </p>
  <button type="button" class="btn btn-primary" (click)="tryAgain()">Try again</button>
</div>
