<div class="az-signin-wrapper">
  <div class="az-card-signin">
    <h1 class="az-logo">YourPHR</h1>

    <div class="az-signin-header">

      <div>
        <h2 class="mb-3">
          <span>Access Restricted</span>
        </h2>
        <p class="text-muted">
          <span>
            Please provide the encryption key to regain access to the application.
          </span>
        </p>

        <form [formGroup]="encryptionKeyForm" class="mt-4" (ngSubmit)="validateAndSetKey()">
          <div class="mb-3">
            <label for="encryptionKey">Encryption Key</label>
            <input type="text" id="encryptionKey" formControlName="encryptionKey" class="form-control"
              [ngClass]="{ 'is-invalid': error }" placeholder="Paste your encryption key here" required [disabled]="isProcessing" />
            @if (error) {
              <div class="invalid-feedback">
                {{ statusMessage }}
              </div>
            }
          </div>

          <div class="mt-3">
            <button type="button" class="btn btn-az-primary w-100"
              [disabled]="isProcessing"
              (click)="handleButtonClick()">
              <span class="button-content-wrapper">
                @if (isProcessing && !isValidated) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                }
                @if (isValidated) {
                  <fa-icon [icon]="['fas', 'check-circle']" class="me-2"></fa-icon>
                }
                <span>
                  @if (!isProcessing && !isValidated && !error) {
                    Validate Key
                  }
                  @if (isProcessing && !isValidated) {
                    {{ statusMessage }}
                  }
                  @if (isValidated) {
                    {{ statusMessage }} ({{ countdown }}s)
                  }
                  @if (error) {
                    <span>Try Again</span>
                  }
                </span>
              </span>
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
