<div class="card card-fhir-resource">
  <div class="card-header" (click)="isCollapsed = !isCollapsed">
    <div>
      <h6 class="card-title">{{ heading }}</h6>
      @if (serviceDates) {
        <p class="card-text tx-gray-400"><strong>Service dates</strong> {{ serviceDates }}</p>
      }
    </div>
    <fhir-ui-badge class="float-end" [status]="$safeNavigationMigration(displayModel?.resourceStatus)">{{ displayModel?.resourceStatus }}</fhir-ui-badge>
  </div>
  <div #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed" class="card-body">
    <!--
    Money first. A patient opening an explanation of benefits is asking "what do I owe?", and
    making them read past claim identifiers to find out is the wrong order (#262).
    -->
    @if (amounts.length) {
      <div class="mg-b-15">
        @for (amount of amounts; track amount) {
          <div class="d-flex justify-content-between border-bottom pd-y-5">
            <span class="tx-gray-600">{{ amount.label }}</span>
            <strong>{{ amount.value }}</strong>
          </div>
        }
      </div>
    }

    <fhir-ui-table [displayModel]="displayModel" [tableData]="tableData"></fhir-ui-table>
  </div>
  @if (showDetails) {
    <div class="card-footer">
      <a class="float-end" [routerLink]="['/explore', $safeNavigationMigration(displayModel?.source_id), 'resource', $safeNavigationMigration(displayModel?.source_resource_id)]">details</a>
    </div>
  }
</div>
