<div class="card card-fhir-resource">
  <div class="card-header" (click)="isCollapsed = ! isCollapsed">
    <div>
      <h6 class="card-title">{{displayModel?.title}}</h6>
      @if (displayModel?.period_start) {
        <p class="card-text tx-gray-400"><strong>Start date</strong> {{$safeNavigationMigration(displayModel?.period_start) | date}}</p>
      }
    </div>
    <fhir-ui-badge class="float-end" [status]="$safeNavigationMigration(displayModel?.status)">{{displayModel?.status}}</fhir-ui-badge>
  </div>
  <div #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed" class="card-body">
    <fhir-ui-table [displayModel]="displayModel" [tableData]="tableData"></fhir-ui-table>
    <!-- US Core MS: narrative (the human-readable plan) -->
    @if (narrative) {
      <div class="az-content-text mg-t-20 careplan-narrative" [innerHTML]="narrative"></div>
    }
  </div>
  @if (showDetails) {
    <div class="card-footer">
      <a class="float-end" [routerLink]="['/explore', $safeNavigationMigration(displayModel?.source_id), 'resource', $safeNavigationMigration(displayModel?.source_resource_id)]">details</a>
    </div>
  }
</div>
