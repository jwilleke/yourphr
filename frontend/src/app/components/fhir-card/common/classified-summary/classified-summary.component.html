@if (hasAny) {
  <div class="fhir-ui-classified-summary mg-b-10">
    @if (classified?.state) {
      <span class="badge bg-primary mg-r-5" title="Status">{{ classified?.state }}</span>
    }
    @if (classified?.verification) {
      <span class="badge bg-info mg-r-5" title="Verification">{{ classified?.verification }}</span>
    }
    @if (classified?.category) {
      <span class="badge bg-secondary mg-r-5" title="Category">{{ classified?.category }}</span>
    }
    @if (classified?.source) {
      <span class="badge bg-secondary mg-r-5" title="Source">{{ classified?.source }}</span>
    }
    @if (classified?.selfReported) {
      <span class="badge bg-light tx-gray-700 mg-r-5" title="Reported by the patient">Self-reported</span>
    }
  </div>
}
