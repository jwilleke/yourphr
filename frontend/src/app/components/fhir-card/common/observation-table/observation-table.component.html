<div class="table-responsive">

  <table class="table">
    <thead>
      <tr>
        @for (header of headers; track header) {
          <th>
            {{header}}
          </th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows; track row) {
        <tr>
          @for (data of row; track data) {
            <td>
              {{data}}
            </td>
          }
        </tr>
      }
    </tbody>
  </table>

</div>
