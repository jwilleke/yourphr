version: "3.9"
services:
  fasten:
    # NOTE: only developers need to build Fasten from source
    # For production, use the pre-built image from GitHub Packages
    # ghcr.io/jwilleke/yourphr:main
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - YOURPHR_ENV=prod
#        - YOURPHR_ENV=sandbox
    hostname: ${HOSTNAME:-fasten}
    # Pass YOURPHR_* app config from .env / .env_custom INTO the container (#397).
    #
    # Compose reads .env only for ${...} substitution in THIS file — it does not forward those
    # values to the container. Without env_file, a setting like YOURPHR_CDA_CONVERTER_ENABLED=true
    # in .env is silently ignored: the app never sees it, and nothing warns. (The backend also
    # loads .env/.env_custom itself, but from its WORKDIR *inside* the container — /opt/fasten —
    # which is not where the host file lives.)
    #
    # .env_custom is for gitignored per-deployment overrides; both are optional.
    env_file:
      - path: .env
        required: false
      - path: .env_custom
        required: false
    environment:
      - HOST_IP=${IP}
      - HOST_PORT=${PORT}
    ports:
      - "${PORT:-9090}:8080"
    volumes:
      - ./db:/opt/fasten/db
      - ./certs:/opt/fasten/certs/shared

  # C-CDA/CCD converter sidecar (#254). Started by DEFAULT (#404): C-CDA XML is what patient portals
  # (Epic MyChart and friends) actually export, so requiring a second container plus two env vars to
  # import your own records was the largest remaining setup barrier. the shipped default points the app here
  # out of the box — a stock `docker compose up` imports an Epic export with no further steps.
  #
  # Image built by .github/workflows/docker-cda-converter.yaml (repackages Metriport's AGPL-3.0
  # fhir-converter at a pinned ref; running it as a separate process keeps it an independent work).
  #
  # INTERNAL ONLY — `expose`, never `ports`. Raw C-CDA is PHI; this must not be reachable from
  # outside the compose network. `fasten` reaches it at http://cda-converter:8080.
  #
  # Don't want it? `docker compose up --scale cda-converter=0`, or set
  # YOURPHR_CDA_CONVERTER_ENABLED=false. The service is stateless and stores nothing.
  cda-converter:
    image: ghcr.io/jwilleke/yourphr-cda-converter:main
    restart: unless-stopped
    expose:
      - "8080"

  # Typesense powers the optional AI-assisted "Search" and "Chat" features (search.enabled,
  # OFF by default — see backend/pkg/config/app-default-config.json). Present in compose so
  # enabling the feature is just flipping the app config; unused, it costs an idle container.
  # Full setup: docs/deployment/search-and-chat.md
  #
  # Don't want it? `docker compose up --scale typesense=0`, or leave YOURPHR_SEARCH_ENABLED unset.
  #
  # PUBLISHED, not just `expose`'d — matching upstream fasten-onprem#594. The frontend's
  # TypesenseService talks to Typesense DIRECTLY from the browser (typesense.service.ts), not
  # through the fasten backend, so the port must be reachable from wherever the browser runs, not
  # just from inside the compose network. `fasten` also reaches it at http://typesense:8108.
  # TYPESENSE_API_KEY must match YOURPHR_SEARCH_API_KEY on the fasten service.
  #
  # Security tradeoff, inherited from upstream and not yet resolved: this reopens exactly what the
  # earlier `expose`-only setup was closing — FHIR-derived records become queryable by anyone who
  # can reach this port. And `search.api_key` is returned in plaintext by the unauthenticated
  # GET /api/settings, so the key alone is not a meaningful barrier. Fine for a trusted single-user
  # dev box; anyone running search/chat on a shared network should route this through an
  # authenticated backend proxy instead before relying on it.
  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
    environment:
      - TYPESENSE_API_KEY=${YOURPHR_SEARCH_API_KEY:-xyz123}
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_ENABLE_CORS=true

volumes:
  typesense-data:
