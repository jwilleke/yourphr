name: Docker (release)
# Publishes ghcr.io/jwilleke/yourphr on a release tag (vX.Y.Z) => :X.Y.Z / :X.Y / :latest — the
# release-gated contract in docs/deployment/deployment-contract.md: pushes to main are CI-tested and
# build NO image; the live instance moves only when a tag is cut. Flux's ImagePolicy filters semver
# tags, so :latest and any branch tag are invisible to it.
#
# This replaces the Go release workflow (yourphr#652). The Go image is frozen at 2.10.3 and lives on
# under the name ghcr.io/jwilleke/yourphr-go; nothing rebuilds it, and its Dockerfile is preserved at
# the v2.10.3 tag if it ever must be.
#
# MULTI-ARCH from one runner: see the Dockerfile — TypeScript compiles on the build platform and
# the one native module ships prebuilds for both arches, so nothing compiles under QEMU.

on:
  push:
    tags: ['v*.*.*']
  # A SECOND TRIGGER, deliberately (yourphr#658). Pushing v3.1.0 created no workflow run at all —
  # not a failed one, none — while the three tags before it fired normally. The contract says a tag
  # publishes an image, and the failure mode was silence: no red run, nothing to notice, and Flux
  # quietly keeping the old digest. Publishing the GitHub Release now fires the same build, so the
  # two ways a release is announced are also two chances for it to be built.
  #
  # Both firing rebuilds the same tag, which is wasteful and harmless: same source, same tags
  # pushed, and the layer cache makes the second pass cheap. A duplicate build is a much better
  # failure than a missing one.
  release:
    types: [published]
  # Manual re-publish of an existing tag (base-image refresh, frontend pin bump) — run from the tag.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    # Dispatched from a branch, every tag pattern below is empty and build-push-action fails on an
    # empty tag list. Skip cleanly instead.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=YourPHR
            org.opencontainers.image.description=YourPHR — your medical records, immediately and in your hands, for free.
            org.opencontainers.image.source=https://github.com/jwilleke/yourphr
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed manifest is multi-arch
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME#v}" | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt && grep -q 'linux/arm64' inspect.txt
