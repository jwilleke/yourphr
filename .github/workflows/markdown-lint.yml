name: Markdown Lint

on:
  push:
    # yourphr-addon: the phr add-on is built on that branch until cutover; without it here its
    # pages went unlinted (32 MD050 errors found only after a merge from main, 2026-10-23).
    branches: [master, main, yourphr-addon]
  pull_request:
    branches: [master, main]

# Least privilege: the lint job only reads the checked-out repo.
permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts: this job lints markdown and needs no native module built. Without it the
      # whole root tree compiles better-sqlite3 to run a text linter.
      - run: npm ci --ignore-scripts

      - name: Lint markdown
        # `npm run lint:md`, NOT markdownlint-cli2-action (yourphr#561). The action bundles its own
        # markdownlint-cli2, so CI and a developer's machine could share one config and still
        # disagree by VERSION — a rule tightened upstream fails here and passes locally, or the
        # reverse, and neither is reproducible from the repository. Running the pinned
        # devDependency makes CI, `npm run lint:md` and the editor the same tool on the same rules.
        #
        # The cost is the action's inline PR annotations; the failure output still names file,
        # line and rule, which is what the fix needs.
        #
        # Globs are not passed here either: `.markdownlint-cli2.jsonc` carries rules AND file set.
        run: npm run lint:md
