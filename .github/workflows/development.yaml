name: Development

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    # NO paths-ignore here. Four of these jobs are REQUIRED checks on main, and a workflow skipped
    # by a path filter never reports, so a docs-only PR waited forever for checks that could not
    # arrive (#830). The `changes` job below decides instead: code jobs are SKIPPED on a docs-only
    # PR, and a skipped job satisfies a required check. Lint Markdown always runs — a docs-only PR
    # is exactly the one it exists for.
  workflow_call:

# Least-privilege default for every job: checkout + test + artifact upload only
# (artifact upload uses its own token), so no write scopes are required. Also
# caps the permissions when called as a reusable workflow from ci.yaml.
permissions:
  contents: read

jobs:
  # Did this PR change anything but documentation? Anything that is not a pull_request (a push via
  # ci.yaml's workflow_call) always runs everything.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=$(git diff --name-only "$BASE...$HEAD" | grep -Ev '(\.md$|^docs/|^LICENSE$)' || true)
          echo "files outside docs:"; echo "${code:-  (none)}"
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  test-frontend:
    name: Test Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Test Frontend
        run: |
          make test-frontend-coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: ${{ github.workspace }}/frontend/coverage/fastenhealth/lcov.info
          retention-days: 1
  audit-frontend-deps:
    name: Audit Frontend Dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      # Dependabot cannot see a dependency resolved from a git URL — it has no registry coordinates
      # to match an advisory against — so the alerts page read "0 open" while a CRITICAL sat in the
      # shipped bundle for months (#530, #533). yarn audit reads the lockfile directly and found it.
      # No install needed: audit works from yarn.lock alone.
      - name: Report every advisory (never fails the build)
        working-directory: frontend
        run: yarn audit --groups dependencies || true
      # Gate ONLY on critical production findings. The tree carries ~23 high advisories in build
      # tooling — eslint, storybook, karma, the Angular devkit — which never reach a browser, and a
      # job that is permanently red teaches everyone to ignore it, which is worse than no job.
      #
      # Yarn Classic's audit exit code is a BITMASK of the severities it reported, not pass/fail:
      # 1 INFO, 2 LOW, 4 MODERATE, 8 HIGH, 16 CRITICAL. Verified on this tree: a single LOW
      # advisory exits 2, not 1. So test bit 16 rather than relying on a non-zero exit, which today
      # would fail every run on that one low finding.
      #
      # NOTE `--level` is deliberately absent: on Yarn Classic it does NOT filter — passing
      # `--level critical` still reports and still counts lows — so including it would suggest a
      # filter that is not happening.
      - name: Fail on critical production advisories
        working-directory: frontend
        run: |
          set +e
          yarn audit --groups dependencies > audit.txt 2>&1
          code=$?
          set -e
          echo "yarn audit exit bitmask: $code"
          tail -5 audit.txt
          if [ $(( code & 16 )) -ne 0 ]; then
            echo "::error::critical advisory in a production dependency — see the report above"
            exit 1
          fi
          echo "no critical production advisories"
  compile-storybook:
    name: Compile Storybook
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - run: |
          make build-storybook

  lint-frontend:
    name: Lint Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: ng lint (angular-eslint)
        run: |
          make lint-frontend

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # --ignore-scripts: linting markdown needs no native module built.
      - run: npm ci --ignore-scripts
      - name: markdownlint
        # ONE source and ONE tool (yourphr#561). `.markdownlint-cli2.jsonc` carries the rules AND
        # the file set — these lived in three places that disagreed before: rules in
        # .markdownlint.jsonc, the glob in package.json, and a third list right here. An inline
        # `globs:` overrides the config file, which recreated exactly that split; only CI's copy
        # still claimed CHANGELOG.md was machine-generated, long after release-please was removed.
        #
        # Running the pinned devDependency rather than markdownlint-cli2-action closes the last
        # gap: the action bundles its own markdownlint-cli2, so CI could share the config and still
        # differ by VERSION from what a developer runs.
        #
        # The config excludes only LICENSE and reaches everything else through `gitignore: true` —
        # git decides what is generated or vendored, so vendor/ and dist/ need no hand-maintained
        # entry here and cannot rot the way the comment did.
        run: npm run lint:md
