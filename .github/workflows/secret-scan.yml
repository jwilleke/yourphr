name: secret-scan

# gitleaks over the checked-out tree: the default secret rules plus the rules and
# allowlists in .gitleaks.toml. The pre-commit hook scans staged changes on the
# machine; this catches commits made without it (other machines, cloud agents).
#
# Kit-managed (overwrite): the pinned gitleaks version and checksum stay in sync
# kit-wide. A repo's own exceptions belong in .gitleaks.toml, which the kit seeds
# once and never touches again.
# https://github.com/jwilleke/mjs-project-template/issues/96

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the tree
        run: gitleaks dir . -c .gitleaks.toml --no-banner --redact -v
